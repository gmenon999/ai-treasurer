name: Daily AI Treasurer Briefing

# 04:00 Qatar (UTC+3) = 01:00 UTC. GitHub's own scheduler is best-effort and can
# lag; the two later crons are self-healing retries (they no-op if today's edition
# already exists). For exact-time delivery, trigger workflow_dispatch from a
# punctual scheduler (e.g. n8n) at 04:00 Qatar.
on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "25 1 * * *"
    - cron: "25 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's edition even if it already exists"
        type: boolean
        default: false
      takes_only:
        description: "Add takes to today's edition without re-running the news"
        type: boolean
        default: false
      market_view_only:
        description: "Refresh the Market view (5 points under Markets) on today's edition; news unchanged"
        type: boolean
        default: false
      preview:
        description: "Build only: do not publish; upload the page for review"
        type: boolean
        default: false

concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Build today's edition
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BRIEF_TAKES: ${{ vars.BRIEF_TAKES }}
          BRIEF_MARKET_VIEW: ${{ vars.BRIEF_MARKET_VIEW }}
        run: |
          set -o pipefail
          python generate.py ${{ github.event.inputs.force == 'true' && '--force' || '' }} ${{ github.event.inputs.takes_only == 'true' && '--takes-only' || '' }} ${{ github.event.inputs.market_view_only == 'true' && '--market-view-only' || '' }} 2>&1 | tee build.log
      - name: Push preview branch (never main)
        if: ${{ always() && github.event.inputs.preview == 'true' }}
        run: |
          git config user.name  "AI Treasurer bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B preview-takes
          git add -A
          git add -f build.log
          git commit -m "Preview build $(date -u +'%d %B %Y %H:%M UTC')" || true
          git push -f origin preview-takes
      - name: Commit and push
        if: ${{ github.event.inputs.preview != 'true' }}
        run: |
          set -e
          git config user.name  "AI Treasurer bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f build.log
          git add -A
          if git diff --cached --quiet; then
            echo "No changes - edition already built today. Nothing to publish."
            exit 0
          fi
          ED="Daily briefing"
          git commit -m "${ED:-New edition} - $(date -u +'%d %B %Y')"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "Published; Netlify will deploy."; break; fi
            [ "$i" = 5 ] && { echo "::error::push failed after 5 tries"; exit 1; }
            sleep $((i*10)); git fetch origin main; git rebase origin/main || { git rebase --abort || true; exit 1; }
          done

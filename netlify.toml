# The AI Treasurer — static site, pre-built. Netlify just publishes the folder.
[build]
  command = ""
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/briefing/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/briefing"
  to = "/"
  status = 301

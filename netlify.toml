# The AI Treasurer — static site, pre-built. Netlify just publishes the folder.
[build]
  command = ""
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[redirects]]
  from = "/welcome.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/briefing/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/briefing"
  to = "/"
  status = 301

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "https://theaitreasurer.com"
